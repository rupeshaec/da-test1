version: 1
indices:
  products:
    target: /products-test-index.json
    include:
      - /products-test/**
    properties:
      name:
        select: div > div > div:has(#name) > div:last-child
        value: textContent(el)
      sku:
        select: div > div > div:has(#sku) > div:last-child
        value: textContent(el)
      price:
        select: div > div > div:has(#price) > div:last-child
        value: textContent(el)
      status:
        select: div > div > div:has(#status) > div:last-child
        value: textContent(el)
      available:
        select: div > div > div:has(#available) > div:last-child
        value: textContent(el)
